<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landing</title>
  <link rel="icon" href="../proyecto/assets/logo/favicon.svg" type="image/svg+xml" />
  <script src="../nucleo/util.js"></script>
  <script src="../proyecto/proyecto.js"></script>
  <script>TRAMOYA.instalarFuentes(); TRAMOYA.instalarTemas('body[data-theme]');</script>
  <style>
    /* Landing de una página: textos en PROYECTO.landing, colores del tema, logo de la marca.
       Se abre desde file:// como todo lo demás; para publicarla alcanza con subir la carpeta
       del repo (o solo landing/, nucleo/ y proyecto/) a cualquier hosting estático. */
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0; background:var(--bg); color:var(--text); font:18px/1.6 var(--font-body)}
    a{color:inherit}
    .wrap{width:min(1180px, calc(100% - 48px)); margin:0 auto}
    .accent{color:var(--accent)}
    h1, h2, h3{font-family:var(--font-display); color:var(--strong); margin:0; letter-spacing:-.02em; line-height:1.05; text-wrap:balance}
    .kicker{display:flex; align-items:center; gap:14px; color:var(--accent); font-weight:700; font-size:13px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:18px}
    .kicker i{width:34px; height:4px; border-radius:2px; background:var(--accent)}

    nav{position:sticky; top:0; z-index:10; backdrop-filter:blur(12px); background:color-mix(in srgb, var(--bg) 80%, transparent); border-bottom:1px solid var(--line)}
    nav .wrap{display:flex; align-items:center; justify-content:space-between; height:72px; gap:20px}
    nav .brand svg{height:34px; width:auto; display:block}
    nav .links{display:flex; gap:22px; font-size:15px; color:var(--muted)}
    nav .links a{text-decoration:none}
    nav .links a:hover{color:var(--strong)}

    .hero{position:relative; min-height:min(88vh, 860px); display:grid; align-items:end; overflow:hidden}
    .hero .bg{position:absolute; inset:0}
    .hero .bg img{width:100%; height:100%; object-fit:cover}
    .hero .bg::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg, var(--overlay) 0%, var(--overlay) 35%, transparent 90%), linear-gradient(0deg, var(--bg), transparent 50%)}
    .hero .wrap{position:relative; padding:120px 0 100px}
    .hero h1{font-size:clamp(46px, 7vw, 104px); max-width:14ch}
    .hero p{font-size:clamp(18px, 2vw, 23px); color:var(--lead); max-width:44ch; margin:26px 0 36px}
    .cta{display:inline-flex; align-items:center; gap:12px; background:var(--accent); color:var(--bg); padding:16px 26px; border-radius:40px; font-weight:700; text-decoration:none}
    .cta:hover{filter:brightness(1.08)}

    section.sec{padding:120px 0; border-top:1px solid var(--line)}
    section.sec h2{font-size:clamp(36px, 4.5vw, 64px); max-width:18ch}
    section.sec .texto{font-size:21px; color:var(--lead); max-width:56ch; margin-top:26px}
    .cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px; margin-top:54px}
    .card{border:1px solid var(--line); background:var(--panel); border-radius:22px; padding:30px; display:flex; flex-direction:column; gap:10px}
    .card i{width:34px; height:4px; background:var(--accent); border-radius:4px}
    .card b{font:800 26px/1.15 var(--font-display); color:var(--strong)}
    .card span{color:var(--muted); font-size:16px}

    footer{border-top:1px solid var(--line); padding:50px 0 70px; color:var(--muted); font-size:14px}
    footer .wrap{display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between}
    footer svg{height:28px; width:auto; display:block}
    footer select{background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit}

    /* Aparición al hacer scroll (sin JS no se oculta nada) */
    .js .rv{opacity:0; transform:translateY(26px); transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1)}
    .js .rv.on{opacity:1; transform:none}
    @media (prefers-reduced-motion: reduce){ .js .rv{opacity:1; transform:none; transition:none} }
    @media (max-width:700px){ nav .links{display:none} }
  </style>
</head>
<body>
  <nav><div class="wrap"><a class="brand" href="#" id="brand"></a><div class="links" id="links"></div></div></nav>
  <header class="hero" id="hero"></header>
  <main id="main"></main>
  <footer><div class="wrap"><div id="footBrand"></div><span id="pie"></span><label>Tema <select id="tema"></select></label></div></footer>

  <script src="../nucleo/marca.js"></script>
  <script src="../proyecto/glifos.js"></script>
  <script>
    const U = TRAMOYA, P = PROYECTO, M = U.marca, L = P.landing || {}, $ = (id) => document.getElementById(id);
    document.documentElement.classList.add('js');
    document.title = `${U.plain(P.nombre)} — ${P.descripcion || ''}`;
    const q = new URLSearchParams(location.search);
    let tema = q.get('tema') || U.leer('landing-tema') || P.estilo?.tema || Object.keys(P.temas)[0];

    function render() {
      document.body.dataset.theme = tema;
      const logo = (alto) => M.buildSVG({ ...M.cfgDe(M.hayEditor() ? 'editor' : 'tema', tema), layout: 'horizontal', margen: 0, lienzo: 'ajustado' }, { background: null }).svg;
      $('brand').innerHTML = logo(); $('footBrand').innerHTML = logo();
      const h = L.hero || {};
      $('hero').innerHTML = `${h.imagen ? `<div class="bg"><img src="${U.esc(h.imagen)}" alt=""></div>` : ''}
        <div class="wrap"><div class="kicker rv"><i></i>${U.md(h.kicker)}</div><h1 class="rv">${U.md(h.titulo)}</h1><p class="rv">${U.md(h.bajada)}</p>
        ${h.cta ? `<a class="cta rv" href="${U.esc(h.ctaUrl || '#')}">${U.esc(h.cta)} →</a>` : ''}</div>`;
      $('main').innerHTML = (L.secciones || []).map((s, i) => `
        <section class="sec" id="s${i}"><div class="wrap">
          <div class="kicker rv"><i></i>${U.md(s.kicker)}</div><h2 class="rv">${U.md(s.titulo)}</h2>
          ${s.texto ? `<p class="texto rv">${U.md(s.texto)}</p>` : ''}
          ${s.items ? `<div class="cards">${U.pairs(s.items).map((it) => `<div class="card rv"><i></i><b>${U.md(it.t)}</b><span>${U.md(it.d)}</span></div>`).join('')}</div>` : ''}
        </div></section>`).join('');
      $('links').innerHTML = (L.secciones || []).map((s, i) => `<a href="#s${i}">${U.esc(U.plain(s.kicker))}</a>`).join('');
      $('pie').textContent = L.pie || '';
      // Aparición escalonada al entrar en pantalla
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } }), { threshold: 0.15 });
      document.querySelectorAll('.rv').forEach((el, i) => { el.style.transitionDelay = `${(i % 4) * 0.08}s`; io.observe(el); });
    }
    Object.entries(P.temas).forEach(([k, t]) => $('tema').add(new Option(t.nombre || k, k)));
    $('tema').value = tema;
    $('tema').onchange = (e) => { tema = e.target.value; U.guardar('landing-tema', tema); render(); };
    window.ready = U.fuentesListas().then(() => { render(); if (q.has('render')) document.querySelectorAll('.rv').forEach((el) => el.classList.add('on')); return true; });
  </script>
</body>
</html>
